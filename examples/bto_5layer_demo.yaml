# BTO homo-5-layer: exercises carry-forward twice. L5 waits through rounds 1 and 2 and is
# combined with the 4-layer block in round 3.
name: bto_5layer_demo
output_dir: runs/bto_5layer_demo
layers:
  - {poscar: moire_structures/bto/bto_1-layer.vasp, material: bto}
  - {poscar: moire_structures/bto/bto_1-layer.vasp, material: bto}
  - {poscar: moire_structures/bto/bto_1-layer.vasp, material: bto}
  - {poscar: moire_structures/bto/bto_1-layer.vasp, material: bto}
  - {poscar: moire_structures/bto/bto_1-layer.vasp, material: bto}
search:
  default: {degmin: 22.0, degmax: 23.0, degstep: 0.01, dtol: 5.0e-4, nmin: -10, nmax: 10, goodangles: [90.0]}
  rounds:
    2: {degmin: 30.0, degmax: 31.0}
    3: {degmin: 35.0, degmax: 40.0, nmin: -40, nmax: 40}
filters:
  max_residual: 1.0e-3
  max_layer_residual: 1.0e-3
